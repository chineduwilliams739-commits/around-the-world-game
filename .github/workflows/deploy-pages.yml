name: Deploy AROUND THE WORLD to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Validate inline JavaScript syntax before downloading assets
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, sys
          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\\b([^>]*)>([\\s\\S]*?)</script\\s*>", html, re.IGNORECASE)
          inline = [body for attrs, body in scripts if not re.search(r"\\bsrc\\s*=", attrs, re.IGNORECASE) and body.strip()]
          if not inline:
              raise SystemExit("No inline JavaScript found to validate")
          for i, body in enumerate(inline, 1):
              path = pathlib.Path(f"/tmp/around-the-world-inline-{i}.js")
              path.write_text(body, encoding="utf-8")
              print(f"Checking inline script {i}/{len(inline)} ({len(body)} characters)")
              result = subprocess.run(["node", "--check", str(path)], text=True)
              if result.returncode:
                  raise SystemExit(f"JavaScript syntax check failed for inline script {i}")
          print(f"JavaScript syntax check passed for all {len(inline)} inline scripts")
          PY
      - name: Download and bundle the animated character and Babylon.js locally
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 \
            "https://www.innerscene.com/api/library/locomotion-collection-maya-3d-person-animated-1499b2fd/download" \
            --output assets/locomotion-collection-maya-3d-person-animated.glb
          test "$(wc -c < assets/locomotion-collection-maya-3d-person-animated.glb)" -gt 1000000
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 \
            "https://www.innerscene.com/api/library/locomotion-collection-sam-3d-person-animated-dc23800f/download" \
            --output assets/locomotion-collection-sam-3d-person-animated.glb
          test "$(wc -c < assets/locomotion-collection-sam-3d-person-animated.glb)" -gt 1000000
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 \
            "https://cdn.babylonjs.com/babylon.js" --output assets/babylon.js
          test "$(wc -c < assets/babylon.js)" -gt 100000
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 \
            "https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js" --output assets/babylonjs.loaders.min.js
          test "$(wc -c < assets/babylonjs.loaders.min.js)" -gt 10000
      - name: Configure and enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static game
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
