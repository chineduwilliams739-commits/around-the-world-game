<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AROUND THE WORLD — Animated Character Test</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a1018;color:#edf3fa;font:14px system-ui,sans-serif}
#renderCanvas{width:100%;height:100%;display:block;touch-action:none;outline:none}
#panel{position:fixed;left:12px;top:12px;max-width:min(440px,calc(100vw - 24px));max-height:calc(100vh - 100px);overflow:auto;padding:14px 16px;border:1px solid #ffffff20;border-radius:14px;background:#0b1524ef;box-shadow:0 10px 36px #0008}
h1{font-size:15px;letter-spacing:.05em;margin:0 0 8px}#status{font-weight:700;color:#ffd27a;margin-bottom:8px}#details{color:#c6d2df;line-height:1.5;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{padding:9px 12px;border:1px solid #7ab8f5;border-radius:9px;background:#16314b;color:#fff;font:600 13px system-ui;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}
#hint{position:fixed;bottom:12px;left:12px;padding:8px 11px;border-radius:10px;background:#0b1524d9;color:#d8e4f1;font-size:12px}
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<section id="panel"><h1>AROUND THE WORLD · REAL ANIMATION TEST</h1><div id="status">Loading a clothed character with real animation clips…</div><div id="details">This is a separate test page. The live game is not being changed.</div><div class="controls"><button id="idle" disabled>Idle / Stand</button><button id="walk" disabled>Walk</button><button id="run" disabled>Run</button><button id="stop" disabled>Stop animation</button></div></section>
<div id="hint">Drag to orbit · Pinch to zoom · Test page only</div>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
<script>
(async()=>{
 const status=document.getElementById('status'),details=document.getElementById('details'),canvas=document.getElementById('renderCanvas');
 const buttons={idle:document.getElementById('idle'),walk:document.getElementById('walk'),run:document.getElementById('run'),stop:document.getElementById('stop')};
 const engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:false,stencil:true,antialias:true});
 const scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color4(.035,.055,.085,1);
 scene.imageProcessingConfiguration.toneMappingEnabled=true;scene.imageProcessingConfiguration.toneMappingType=BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;scene.imageProcessingConfiguration.exposure=1.05;scene.imageProcessingConfiguration.contrast=1.12;
 const camera=new BABYLON.ArcRotateCamera('camera',-Math.PI/2,1.12,3.8,new BABYLON.Vector3(0,.9,0),scene);camera.attachControl(canvas,true);camera.lowerRadiusLimit=1.7;camera.upperRadiusLimit=8;camera.wheelPrecision=55;camera.panningSensibility=0;
 const hemi=new BABYLON.HemisphericLight('ambient',new BABYLON.Vector3(0,1,0),scene);hemi.intensity=.9;
 const key=new BABYLON.DirectionalLight('key',new BABYLON.Vector3(-.5,-1,.4),scene);key.position=new BABYLON.Vector3(3,6,-3);key.intensity=1.5;
 const fill=new BABYLON.PointLight('fill',new BABYLON.Vector3(-3,2,2),scene);fill.intensity=18;fill.diffuse=new BABYLON.Color3(.45,.65,1);
 const ground=BABYLON.MeshBuilder.CreateGround('ground',{width:12,height:12},scene);const gm=new BABYLON.PBRMaterial('groundMat',scene);gm.albedoColor=new BABYLON.Color3(.055,.075,.095);gm.roughness=.95;ground.material=gm;
 const grid=BABYLON.MeshBuilder.CreateGround('grid',{width:12,height:12,subdivisions:12},scene);const grm=new BABYLON.StandardMaterial('gridMat',scene);grm.wireframe=true;grm.emissiveColor=new BABYLON.Color3(.12,.2,.28);grm.alpha=.18;grid.material=grm;grid.position.y=.006;
 let groups=[];
 function playGroup(group){if(!group)return;groups.forEach(g=>{try{g.stop();}catch(e){}});try{group.start(true,1,group.from,group.to,false);status.textContent='Playing: '+group.name;status.style.color='#8de6b0';}catch(e){details.textContent+='\nAnimation start failed: '+group.name+' — '+e.message;}}
 function findGroup(regex){return groups.find(g=>regex.test(String(g.name||'')));}
 try{
  status.textContent='Downloading the rigged Casual Woman model…';
  const rootUrl='https://grab3d.com/dl/woman-rigged/',fileName='woman-rigged.glb';
  const imported=await BABYLON.SceneLoader.ImportMeshAsync(null,rootUrl,fileName,scene);
  const geometry=imported.meshes.filter(m=>m.getTotalVertices&&m.getTotalVertices()>0);
  imported.meshes.forEach(m=>{m.setEnabled(true);m.isVisible=true;m.visibility=1;m.isPickable=false;m.computeWorldMatrix(true);});
  const modelRoot=imported.meshes.find(m=>!m.parent)||imported.meshes[0];
  const bounds=modelRoot.getHierarchyBoundingVectors(true),height=bounds.max.y-bounds.min.y;
  if(!Number.isFinite(height)||height<.3)throw new Error('Model bounds invalid; measured height '+height);
  const wrapper=new BABYLON.TransformNode('previewWrapper',scene);modelRoot.parent=wrapper;const scale=1.8/height;wrapper.scaling.setAll(scale);wrapper.position.set(-((bounds.min.x+bounds.max.x)/2)*scale,-bounds.min.y*scale,-((bounds.min.z+bounds.max.z)/2)*scale);wrapper.computeWorldMatrix(true);
  camera.setTarget(new BABYLON.Vector3(0,.92,0));
  groups=imported.animationGroups||[];
  const skinned=geometry.filter(m=>m.skeleton).length;
  const boneCount=imported.skeletons.reduce((n,s)=>n+s.bones.length,0);
  details.textContent='Source: Grab3D Casual Woman (CC0)\nVisible meshes: '+geometry.length+'\nSkinned meshes: '+skinned+'\nSkeletons: '+imported.skeletons.length+'\nBones: '+boneCount+'\nAnimation groups: '+groups.length+'\nAnimation names: '+(groups.map(g=>g.name).join(', ')||'(none found)')+'\n\nThis is a different character asset with walk/run clips included. The existing Businesswoman 01 is not being modified.';
  status.textContent='Character loaded — checking real animation clips';status.style.color='#8de6b0';
  const idleGroup=findGroup(/idle|stand|breath/i),walkGroup=findGroup(/walk/i),runGroup=findGroup(/run|jog/i);
  buttons.idle.disabled=!idleGroup;buttons.walk.disabled=!walkGroup;buttons.run.disabled=!runGroup;buttons.stop.disabled=!groups.length;
  buttons.idle.onclick=()=>playGroup(idleGroup);buttons.walk.onclick=()=>playGroup(walkGroup);buttons.run.onclick=()=>playGroup(runGroup);
  buttons.stop.onclick=()=>{groups.forEach(g=>g.stop());status.textContent='Animation stopped';status.style.color='#ffd27a';};
  if(idleGroup)playGroup(idleGroup);else if(walkGroup)playGroup(walkGroup);else if(runGroup)playGroup(runGroup);else status.textContent='Model loaded, but no animation groups were exposed';
  console.info('Animated character test',{meshes:geometry.length,skinned,bones:boneCount,animationGroups:groups.map(g=>g.name),height});
 }catch(e){
  status.textContent='Animated model could not be loaded';status.style.color='#ff9b9b';
  details.textContent='Error: '+String(e&&e.message||e)+'\n\nThe external GLB may be blocked by network/CORS, or its format may be incompatible. This is a test only; the live game remains unchanged.\n\nModel source: https://grab3d.com/models/characters/woman/';
  console.error('Animated character test failed',e);
 }
 engine.runRenderLoop(()=>scene.render());window.addEventListener('resize',()=>engine.resize());
})();
</script>
</body></html>
