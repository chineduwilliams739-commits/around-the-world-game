<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>AROUND THE WORLD — Character Diagnostic</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a1018;color:#edf3fa;font:14px system-ui,sans-serif}#renderCanvas{width:100%;height:100%;display:block;touch-action:none}#panel{position:fixed;left:12px;top:12px;max-width:min(440px,calc(100vw - 24px));max-height:calc(100vh - 30px);overflow:auto;padding:14px 16px;border:1px solid #ffffff20;border-radius:14px;background:#0b1524ef;box-shadow:0 10px 36px #0008}h1{font-size:15px;margin:0 0 8px}#status{font-weight:700;color:#ffd27a;margin-bottom:8px}#details{color:#c6d2df;line-height:1.5;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}button{margin:8px 5px 0 0;padding:9px 12px;border:1px solid #7ab8f5;border-radius:9px;background:#16314b;color:#fff;font-weight:600}button:disabled{opacity:.4}
</style></head><body><canvas id="renderCanvas"></canvas>
<section id="panel"><h1>AROUND THE WORLD · CHARACTER DIAGNOSTIC</h1><div id="status">Diagnostic page started. Preparing 3D engine…</div><div id="details">If loading stalls, this page will show which step timed out. The live game is unchanged.</div><div><button id="idle" disabled>Idle / Stand</button><button id="walk" disabled>Walk</button><button id="run" disabled>Run</button><button id="stop" disabled>Stop</button></div></section>
<script>
(function(){
const status=document.getElementById('status'),details=document.getElementById('details'),canvas=document.getElementById('renderCanvas');
const buttons={idle:document.getElementById('idle'),walk:document.getElementById('walk'),run:document.getElementById('run'),stop:document.getElementById('stop')};
function fail(step,e){status.textContent='FAILED: '+step;status.style.color='#ff9b9b';details.textContent=String(e&&e.message||e||'Unknown error')+'\n\nPlease send a screenshot of this message. The main game has not been changed.';}
function timeout(p,ms,label){return Promise.race([p,new Promise((_,reject)=>setTimeout(()=>reject(new Error(label+' timed out after '+Math.round(ms/1000)+' seconds')),ms))]);}
function loadScript(src){return timeout(new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('Could not load '+src+' (check the deployed file path/network).'));document.head.appendChild(s);}),15000,'Script '+src);}
(async()=>{
let engine,scene;
try{
 status.textContent='Step 1/4: Loading local Babylon.js engine…';
 await loadScript('assets/babylon.js');
 if(!window.BABYLON)throw new Error('Babylon.js script loaded but window.BABYLON is missing.');
 status.textContent='Step 2/4: Loading local 3D model loader…';
 await loadScript('assets/babylonjs.loaders.min.js');
 status.textContent='Step 3/4: Starting graphics…';
 engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:false,stencil:true,antialias:true});
 scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color4(.035,.055,.085,1);
 const camera=new BABYLON.ArcRotateCamera('camera',-Math.PI/2,1.12,3.8,new BABYLON.Vector3(0,.9,0),scene);camera.attachControl(canvas,true);camera.lowerRadiusLimit=1.7;camera.upperRadiusLimit=8;
 const hemi=new BABYLON.HemisphericLight('ambient',new BABYLON.Vector3(0,1,0),scene);hemi.intensity=1;
 const key=new BABYLON.DirectionalLight('key',new BABYLON.Vector3(-.5,-1,.4),scene);key.position=new BABYLON.Vector3(3,6,-3);key.intensity=1.4;
 const ground=BABYLON.MeshBuilder.CreateGround('ground',{width:12,height:12},scene);const mat=new BABYLON.StandardMaterial('groundMat',scene);mat.diffuseColor=new BABYLON.Color3(.08,.11,.14);ground.material=mat;
 engine.runRenderLoop(()=>{if(scene)scene.render()});window.addEventListener('resize',()=>engine.resize());
 status.textContent='Step 4/4: Downloading character model…';
 const modelPromise=BABYLON.SceneLoader.ImportMeshAsync(null,'assets/','locomotion-collection-maya-3d-person-animated.glb',scene,evt=>{
  if(evt&&evt.lengthComputable&&evt.total>0)status.textContent='Step 4/4: Downloading model '+Math.round(evt.loaded/evt.total*100)+'%…';
  else if(evt&&evt.loaded)status.textContent='Step 4/4: Downloading model ('+Math.round(evt.loaded/1048576)+' MB)…';
 });
 const imported=await timeout(modelPromise,60000,'Character model download/load');
 const meshes=imported.meshes.filter(m=>m.getTotalVertices&&m.getTotalVertices()>0);
 if(!meshes.length)throw new Error('The model file loaded but contains no visible geometry.');
 imported.meshes.forEach(m=>{m.setEnabled(true);m.isVisible=true;m.visibility=1;m.isPickable=false;});
 const root=imported.meshes.find(m=>!m.parent)||imported.meshes[0],bounds=root.getHierarchyBoundingVectors(true),height=bounds.max.y-bounds.min.y;
 if(!Number.isFinite(height)||height<.3)throw new Error('Invalid model bounds; measured height '+height);
 const wrapper=new BABYLON.TransformNode('previewWrapper',scene);root.parent=wrapper;const scale=1.8/height;wrapper.scaling.setAll(scale);wrapper.position.set(-((bounds.min.x+bounds.max.x)/2)*scale,-bounds.min.y*scale,-((bounds.min.z+bounds.max.z)/2)*scale);
 camera.setTarget(new BABYLON.Vector3(0,.9,0));
 const groups=imported.animationGroups||[],find=re=>groups.find(g=>re.test(String(g.name||''))),idle=find(/idle|stand|breath/i),walk=find(/walk/i),run=find(/run|jog/i);
 details.textContent='Model loaded successfully.\nMeshes: '+meshes.length+'\nSkinned meshes: '+meshes.filter(m=>m.skeleton).length+'\nSkeletons: '+imported.skeletons.length+'\nAnimation groups: '+groups.length+'\nAnimation names: '+(groups.map(g=>g.name).join(', ')||'(none)')+'\nModel height: '+height.toFixed(2);
 function play(g){groups.forEach(x=>x.stop());if(g){g.start(true);status.textContent='Character loaded — playing '+g.name;status.style.color='#8de6b0';}else status.textContent='Character loaded, but this animation was not found.';}
 buttons.idle.disabled=!idle;buttons.walk.disabled=!walk;buttons.run.disabled=!run;buttons.stop.disabled=!groups.length;
 buttons.idle.onclick=()=>play(idle);buttons.walk.onclick=()=>play(walk);buttons.run.onclick=()=>play(run);buttons.stop.onclick=()=>{groups.forEach(g=>g.stop());status.textContent='Animation stopped';};
 if(idle)play(idle);else if(walk)play(walk);else if(run)play(run);else{status.textContent='Model loaded, but no animation clips found';status.style.color='#ffd27a';}
}catch(e){fail(status.textContent,e);}
})();
})();
</script></body></html>
